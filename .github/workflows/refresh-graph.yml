name: Refresh contribution graph

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate graph.svg
        run: python3 update-graph.py ishanmalu 6

      - name: Commit if it changed
        run: |
          if git diff --quiet -- graph-light.svg graph-dark.svg; then
            echo "unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh contribution graph" -- graph-light.svg graph-dark.svg
          git push
